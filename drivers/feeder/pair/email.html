<form class="homey-form" onsubmit="return false;">
    <div class="homey-form-group">
        <label class="homey-form-label" for="email" data-i18n="pair.email.label">Email</label>
        <input class="homey-form-input" id="email" type="email" placeholder="example@mail.com" autocomplete="email"/>
    </div>
</form>

<script type="application/javascript">
    // Homey's own Continue button moves to the pincode view; the app requests the
    // code there. This view only reports what was typed, and shows any error when
    // the app sends the user back here.
    const emailInput = document.getElementById('email');

    function reportEmail() {
        Homey.emit('email_changed', {email: emailInput.value}).catch(function () {});
    }

    emailInput.addEventListener('input', reportEmail);
    emailInput.addEventListener('change', reportEmail);

    Homey.emit('email_view_loaded').then(function (state) {
        if (state && state.email) emailInput.value = state.email;
        if (state && state.error) Homey.alert(state.error, 'error');
    }).catch(function () {});
</script>
